name: Godot CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_DIR: 4.7.2.stable
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  service:
    name: Community service tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify checked out revision
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          echo "Validated source SHA: ${SOURCE_SHA}"

      - name: Run community service tests
        run: npm --prefix service test

  build:
    name: Validate and export Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3             -o /tmp/godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"

          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755             "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"             /usr/local/bin/godot

          curl -fL --retry 3             -o /tmp/godot-templates.tpz             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"

          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a             /tmp/godot-templates/templates/.             "${HOME}/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"

      - name: Show Godot version
        run: godot --version

      - name: Verify checked out revision
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          echo "Validated source SHA: ${SOURCE_SHA}"

      - name: Import and parse project
        run: godot --headless --path . --editor --quit

      - name: Run headless scene smoke tests
        run: godot --headless --path . --script tests/smoke.gd

      - name: Export Web release
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck

      - name: Upload Web build
        uses: actions/upload-artifact@v7
        with:
          name: errow-web-${{ env.SOURCE_SHA }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy Web to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, service]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
